<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0614;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
    cursor: default;
  }

  #universe {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  canvas#stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .title-section {
    text-align: center;
    z-index: 2;
    margin-bottom: 2.5rem;
    animation: fadeDown 1.8s ease forwards;
    opacity: 0;
  }
  .title-section h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: #f5e6c8;
    letter-spacing: 0.08em;
    font-weight: 400;
    text-shadow: 0 0 40px rgba(255,200,120,0.4);
  }
  .title-section .subtitle {
    font-size: 1.1rem;
    color: #c9a86c;
    font-style: italic;
    margin-top: 0.5rem;
    letter-spacing: 0.15em;
  }

  .envelope-container {
    z-index: 2;
    animation: fadeUp 2s ease 0.6s forwards;
    opacity: 0;
    cursor: pointer;
    perspective: 800px;
  }

  .envelope {
    position: relative;
    width: 320px;
    height: 220px;
    transition: transform 0.4s ease;
  }
  .envelope:hover { transform: scale(1.04) translateY(-4px); }

  .env-body {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(160deg, #2d1b4e 0%, #1a0f2e 60%, #0d0720 100%);
    border-radius: 4px 4px 12px 12px;
    border: 1px solid #6b3fa0;
    box-shadow: 0 0 60px rgba(107,63,160,0.35), inset 0 0 30px rgba(255,180,100,0.03);
  }
  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #3d2460;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    z-index: 3;
  }
  .env-flap.open { transform: rotateX(180deg); }

  .env-seal {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    background: radial-gradient(circle, #c9622a 0%, #8b2a0a 100%);
    border-radius: 50%;
    border: 2px solid #e8924a;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(201,98,42,0.6);
    z-index: 4;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .env-seal.hidden { transform: translate(-50%,-50%) scale(0); opacity: 0; }

  .env-wax { color: #f5dbb5; }

  .letter-wrapper {
    z-index: 2;
    width: min(560px, 92vw);
    margin-top: 1.5rem;
    display: none;
    animation: letterReveal 0.8s ease forwards;
  }
  .letter-wrapper.visible { display: block; }

  .letter-card {
    background: linear-gradient(145deg, #fdf8ee 0%, #f7edd5 100%);
    border-radius: 12px;
    padding: 2.5rem 2.8rem;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,160,80,0.3);
    position: relative;
    overflow: hidden;
  }
  .letter-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      transparent, transparent 31px, rgba(180,140,80,0.12) 31px, rgba(180,140,80,0.12) 32px
    );
    pointer-events: none;
  }
  .letter-card::after {
    content: '';
    position: absolute;
    left: 56px; top: 0; bottom: 0;
    width: 1px;
    background: rgba(220,100,80,0.18);
  }

  .letter-date {
    text-align: right;
    font-size: 0.95rem;
    color: #7a5533;
    margin-bottom: 1.5rem;
    font-style: italic;
  }
  .letter-salutation {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #3d1a0a;
    margin-bottom: 1.2rem;
  }
  .letter-body {
    font-size: 1.1rem;
    line-height: 2.05;
    color: #2a1505;
    min-height: 160px;
    position: relative;
    z-index: 1;
  }
  .cursor {
    display: inline-block;
    width: 2px; height: 1.1em;
    background: #5a2d0c;
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
    margin-left: 1px;
  }
  .letter-closing {
    margin-top: 1.8rem;
    text-align: right;
    font-style: italic;
    color: #5a2d0c;
    font-size: 1.05rem;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .letter-closing.visible { opacity: 1; }
  .letter-signature {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    margin-top: 0.3rem;
    color: #3d1a0a;
  }

  .flowers-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 2rem;
    opacity: 0;
    transform: translateY(16px);
    transition: all 1s ease;
    z-index: 2;
  }
  .flowers-row.visible { opacity: 1; transform: translateY(0); }

  .flower-svg { animation: floatFlower 4s ease-in-out infinite; }
  .flower-svg:nth-child(2) { animation-delay: 0.8s; }
  .flower-svg:nth-child(3) { animation-delay: 1.6s; }

  .love-btn {
    z-index: 2;
    margin-top: 2rem;
    padding: 0.85rem 2.4rem;
    background: linear-gradient(135deg, #8b1a4a 0%, #c9306a 100%);
    color: #fde8f0;
    border: none;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(180,40,90,0.45);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    opacity: 0;
    display: none;
  }
  .love-btn.visible { display: block; opacity: 1; animation: fadeUp 0.8s ease forwards; }
  .love-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 40px rgba(180,40,90,0.6); }
  .love-btn:active { transform: scale(0.97); }

  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .hint-text {
    z-index: 2;
    color: #e6ccff;
    font-style: italic;
    font-size: 0.95rem;
    margin-top: 0.8rem;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes letterReveal {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0; }
  }
  @keyframes floatFlower {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti-canvas"></canvas>

<div id="universe">
  <div class="title-section">
    <h1>Our Little Universe</h1>
    <div class="subtitle">một vũ trụ chỉ dành riêng cho iem Chip ✦</div>
  </div>

  <div class="envelope-container" id="envWrap" onclick="openEnvelope()">
    <div class="envelope">
      <div class="env-flap" id="envFlap"></div>
      <div class="env-body"></div>
      <div class="env-seal" id="envSeal"><span class="env-wax">♡</span></div>
    </div>
    <p class="hint-text" style="text-align:center; margin-top:0.6rem;">✦ Chip chạm vào để mở nha ✦</p>
  </div>

  <div class="letter-wrapper" id="letterWrapper">
    <div class="letter-card">
      <div class="letter-date" id="letterDate"></div>
      <div class="letter-salutation">Gửi Chip thúiii,</div>
      <div class="letter-body" id="letterBody"><span class="cursor" id="cursor"></span></div>
      <div class="letter-closing" id="letterClosing">
        Ghét em nhất trên đời,<br>
        <span class="letter-signature">Fong 💕</span>
      </div>
    </div>
  </div>

  <div class="flowers-row" id="flowersRow">
    <svg class="flower-svg" width="70" height="80" viewBox="0 0 70 80">
      <g transform="translate(35,42)">
        <ellipse rx="9" ry="16" fill="#e8a0bf" transform="rotate(0) translate(0,-16)"/>
        <ellipse rx="9" ry="16" fill="#e8a0bf" transform="rotate(60) translate(0,-16)"/>
        <ellipse rx="9" ry="16" fill="#f2c0d4" transform="rotate(120) translate(0,-16)"/>
        <ellipse rx="9" ry="16" fill="#e8a0bf" transform="rotate(180) translate(0,-16)"/>
        <ellipse rx="9" ry="16" fill="#f2c0d4" transform="rotate(240) translate(0,-16)"/>
        <ellipse rx="9" ry="16" fill="#e8a0bf" transform="rotate(300) translate(0,-16)"/>
        <circle r="10" fill="#f9e04b"/>
        <circle r="6" fill="#f4c430"/>
      </g>
      <line x1="35" y1="60" x2="32" y2="80" stroke="#4a8c3f" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="27" cy="74" rx="8" ry="5" fill="#5fa854" transform="rotate(-20,27,74)"/>
    </svg>
    <svg class="flower-svg" width="70" height="90" viewBox="0 0 70 90">
      <g transform="translate(35,40)">
        <ellipse rx="10" ry="18" fill="#c084fc" transform="rotate(0) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#a855f7" transform="rotate(45) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#c084fc" transform="rotate(90) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#a855f7" transform="rotate(135) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#c084fc" transform="rotate(180) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#a855f7" transform="rotate(225) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#c084fc" transform="rotate(270) translate(0,-18)"/>
        <ellipse rx="10" ry="18" fill="#a855f7" transform="rotate(315) translate(0,-18)"/>
        <circle r="11" fill="#fdf4c0"/>
        <circle r="7" fill="#f9e04b"/>
      </g>
      <line x1="35" y1="58" x2="33" y2="90" stroke="#4a8c3f" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="43" cy="80" rx="9" ry="5" fill="#5fa854" transform="rotate(25,43,80)"/>
    </svg>
    <svg class="flower-svg" width="70" height="80" viewBox="0 0 70 80">
      <g transform="translate(35,38)">
        <ellipse rx="8" ry="15" fill="#fda4af" transform="rotate(0) translate(0,-15)"/>
        <ellipse rx="8" ry="15" fill="#fb7185" transform="rotate(72) translate(0,-15)"/>
        <ellipse rx="8" ry="15" fill="#fda4af" transform="rotate(144) translate(0,-15)"/>
        <ellipse rx="8" ry="15" fill="#fb7185" transform="rotate(216) translate(0,-15)"/>
        <ellipse rx="8" ry="15" fill="#fda4af" transform="rotate(288) translate(0,-15)"/>
        <circle r="9" fill="#fff1a8"/>
        <circle r="5.5" fill="#fde047"/>
      </g>
      <line x1="35" y1="55" x2="37" y2="80" stroke="#4a8c3f" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="42" cy="73" rx="8" ry="5" fill="#5fa854" transform="rotate(20,42,73)"/>
    </svg>
  </div>

  <button class="love-btn" id="loveBtn" onclick="sendLove()">💌 Em đấm vỡ nút này để thấy điều bất ngờ nhé =)))</button>
</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 240; i++) {
  stars.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.5 + 0.3,
    twinkleSpeed: 0.5 + Math.random() * 2,
    twinkleOffset: Math.random() * Math.PI * 2,
    color: ['#ffffff','#ffe8c0','#c0d8ff','#ffd0f0'][Math.floor(Math.random()*4)]
  });
}

let time = 0;
function drawStars() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  time += 0.016;
  stars.forEach(s => {
    const alpha = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI*2);
    ctx.fill();
  });

  shootingStars = shootingStars.filter(ss => {
    ss.progress += ss.speed;
    const x = ss.x + ss.dx * ss.progress;
    const y = ss.y + ss.dy * ss.progress;
    const tail = 80;
    const grd = ctx.createLinearGradient(x, y, x - ss.dx*tail, y - ss.dy*tail);
    grd.addColorStop(0, 'rgba(255,240,200,0.9)');
    grd.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.globalAlpha = 1 - ss.progress / 100;
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - ss.dx*tail, y - ss.dy*tail);
    ctx.stroke();
    return ss.progress < 100;
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
drawStars();

setInterval(() => {
  const angle = (-40 + Math.random()*30) * Math.PI/180;
  shootingStars.push({
    x: Math.random() * canvas.width * 0.7,
    y: Math.random() * canvas.height * 0.3,
    dx: Math.cos(angle), dy: Math.sin(angle),
    speed: 1.5 + Math.random(), progress: 0
  });
}, 3500);

let opened = false;
function openEnvelope() {
  if (opened) return;
  opened = true;
  document.getElementById('envFlap').classList.add('open');
  document.getElementById('envSeal').classList.add('hidden');
  document.getElementById('envWrap').querySelector('.hint-text').style.display = 'none';
  setTimeout(() => {
    document.getElementById('envWrap').style.display = 'none';
    showLetter();
  }, 900);
}

const letterText = `Hey baby, I know you've only been there a few days, and you're probably busy arranging your accommodation, paperwork, and getting used to the new environment.\n\nSince you haven't started school yet, this period is probably a bit chaotic and tiring. I'm also busy, so we haven't talked much. I just wanted you to know that I still miss you. Take your time and get everything settled, you don't need to rush to reply to my messages or call when you're tired. I'll be here waiting for you to get everything settled. Hang in there sweetie!`;

let charIdx = 0;
let typingInterval;
const letterBody = document.getElementById('letterBody');
const cursor = document.getElementById('cursor');

function setLetterDate() {
  const now = new Date();
  const months = ['tháng 1','tháng 2','tháng 3','tháng 4','tháng 5','tháng 6','tháng 7','tháng 8','tháng 9','tháng 10','tháng 11','tháng 12'];
  document.getElementById('letterDate').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

function showLetter() {
  setLetterDate();
  const wrapper = document.getElementById('letterWrapper');
  wrapper.classList.add('visible');
  let displayText = '';
  charIdx = 0;
  typingInterval = setInterval(() => {
    if (charIdx < letterText.length) {
      const ch = letterText[charIdx];
      if (ch === '\n') {
        displayText += '<br>'; 
      } else {
        displayText += ch;
      }
      letterBody.innerHTML = displayText;
      letterBody.appendChild(cursor);
      charIdx++;
    } else {
      clearInterval(typingInterval);
      cursor.style.display = 'none';
      setTimeout(() => {
        document.getElementById('letterClosing').classList.add('visible');
        setTimeout(() => {
          document.getElementById('flowersRow').classList.add('visible');
          setTimeout(() => document.getElementById('loveBtn').classList.add('visible'), 800);
        }, 600);
      }, 500);
    }
  }, 28);
}

const cCanvas = document.getElementById('confetti-canvas');
const cCtx = cCanvas.getContext('2d');
let confettiParticles = [];
let confettiActive = false;

function resizeConfetti() {
  cCanvas.width = window.innerWidth;
  cCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener('resize', resizeConfetti);

// Bảng màu cho hoa tươi sáng và lãng mạn hơn
const COLORS = ['#ff6b9d', '#fda4af', '#f9a8d4', '#c084fc', '#a855f7', '#93c5fd', '#ffffff'];

function launchConfetti() {
  confettiParticles = [];
  confettiActive = true;
  // Giảm số lượng xuống 80 vì hoa to hơn để tránh bị ngợp
  for (let i = 0; i < 80; i++) {
    confettiParticles.push({
      x: Math.random() * cCanvas.width,
      y: -50,
      vx: (Math.random()-0.5)*5,
      vy: 1.5 + Math.random()*3.5,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      size: 14 + Math.random()*12, // Kích thước hoa to hơn hẳn
      shape: Math.random() > 0.5 ? 'daisy' : 'sakura', // Đổi sang hình hoa
      rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*4,
      gravity: 0.04 + Math.random()*0.04,
      life: 1
    });
  }
  animateConfetti();
}

// Hàm vẽ hoa mới (sang và xịn hơn)
function drawFlower(ctx, x, y, size, color, type) {
  ctx.save();
  ctx.translate(x, y);
  
  if (type === 'daisy') {
    // Hoa 6 cánh
    ctx.fillStyle = color;
    for (let i = 0; i < 6; i++) {
      ctx.rotate((Math.PI * 2) / 6);
      ctx.beginPath();
      ctx.ellipse(0, size * 0.6, size * 0.3, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Nhụy hoa
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Hoa 5 cánh mềm mại (kiểu hoa đào/hoa hồng)
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      ctx.rotate((Math.PI * 2) / 5);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(size*0.6, size*0.2, size*0.7, size*1.2, 0, size*1.1);
      ctx.bezierCurveTo(-size*0.7, size*1.2, -size*0.6, size*0.2, 0, 0);
      ctx.fill();
    }
    // Nhụy hoa
    ctx.fillStyle = '#fff8e7';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function animateConfetti() {
  if (!confettiActive) return;
  cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < cCanvas.height+60);
  confettiParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rot += p.rotSpeed;
    if (p.y > cCanvas.height*0.7) p.life -= 0.015;
    
    cCtx.globalAlpha = p.life;
    cCtx.save();
    cCtx.translate(p.x, p.y);
    cCtx.rotate(p.rot * Math.PI/180);
    // Gọi hàm vẽ hoa mới
    drawFlower(cCtx, 0, 0, p.size, p.color, p.shape);
    cCtx.restore();
  });
  
  cCtx.globalAlpha = 1;
  if (confettiParticles.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    confettiActive = false;
    cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  }
}

function sendLove() {
  launchConfetti();
  const btn = document.getElementById('loveBtn');
  btn.textContent = '🌸 P/S I miss you! 🌸';
  btn.style.background = 'linear-gradient(135deg, #5b21b6 0%, #a855f7 100%)';
  btn.style.boxShadow = '0 8px 30px rgba(168,85,247,0.5)';
  setTimeout(() => launchConfetti(), 1400); // Thêm nhịp bung đợt 2 trễ hơn chút xíu
}
</script>
</body>
</html>
